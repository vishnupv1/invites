    <script id="site-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "InvitesReady",
            "url": "https://invitesready.com/",
            "email": "hello@invitesready.com",
            "logo": "https://invitesready.com/brand/mark.png"
          },
          {
            "@type": "WebSite",
            "name": "InvitesReady",
            "url": "https://invitesready.com/",
            "description": "Digital invitations for a wedding, nikah, shaadi, Tamil wedding, baptism, or housewarming. Design one, share the link, and collect replies."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do my guests need an app or an account?",
                "acceptedAnswer": { "@type": "Answer", "text": "No. Guests open your link in any browser and RSVP in one tap — it works on basic phones too." }
              },
              {
                "@type": "Question",
                "name": "Can I design before signing up?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Pick a template and customise it as a guest. We only ask you to log in when you publish, and your draft comes with you." }
              },
              {
                "@type": "Question",
                "name": "Can different guests see different functions?",
                "acceptedAnswer": { "@type": "Answer", "text": "Yes. Put guests into groups and choose which functions each group sees." }
              },
              {
                "@type": "Question",
                "name": "Is our family information private?",
                "acceptedAnswer": { "@type": "Answer", "text": "Pages can be password-protected, and the address can stay hidden until a guest says yes." }
              },
              {
                "@type": "Question",
                "name": "Can I edit after sending?",
                "acceptedAnswer": { "@type": "Answer", "text": "Of course — every guest sees the latest version through the same link." }
              }
            ]
          }
        ]
      }
    </script>
